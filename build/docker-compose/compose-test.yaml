services:
  # Test MongoDB service
  mongo_db_test:
    image: mongo:7.0-rc
    container_name: mongo_db_test
    restart: always
    ports:
      - 27018:27017  # Map container's MongoDB port 27017 to host's 27018 for testing
    volumes:
      - db_data_test:/data/db  # Separate volume for testing
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PN_REGISTRY_API_MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${PN_REGISTRY_API_MONGODB_PASSWORD}
      
  mongo_express_test:
    image: mongo-express
    container_name: mongo_express_test
    restart: always
    ports:
      - 8082:8081  # Expose Mongo Express on a different port (8082) for the test database
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${PN_REGISTRY_API_MONGODB_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${PN_REGISTRY_API_MONGODB_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongo_db_test
      ME_CONFIG_BASICAUTH_USERNAME: mexpress_test
      ME_CONFIG_BASICAUTH_PASSWORD: mexpress_test
    links:
      - mongo_db_test  # Connect to the test MongoDB instance

volumes:
  db_data_test: {}  # Separate volume for test database data

